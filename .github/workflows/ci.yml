name: CI

on:
  push:
    branches: [main, "release/*", "develop/*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

  build:
    name: Build Windows EXE
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name EasyPrompt \
            --paths src --collect-data PySide6 src/easyprompt/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPrompt-windows
          path: dist/EasyPrompt.exe
